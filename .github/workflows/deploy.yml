name: 🚀 Deploy to Cloudflare Pages (Dev/Stg/Prod)

on:
  push:
    branches:
      - main      # Production
      - staging   # Staging
      - develop   # Development
  pull_request:
    branches:
      - main
      - staging
      - develop

permissions:
  contents: read
  deployments: write
  pages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "18"

jobs:
  # 確定目標環境
  determine-environment:
    name: 🎯 Determine Target Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      project_name: ${{ steps.env.outputs.project_name }}
      preview_url: ${{ steps.env.outputs.preview_url }}
    steps:
      - name: 🔍 Detect Environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "project_name=zbot-games-galaxian-prod" >> $GITHUB_OUTPUT
            echo "preview_url=https://zbot-games-galaxian-prod.pages.dev" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "project_name=zbot-games-galaxian-stg" >> $GITHUB_OUTPUT
            echo "preview_url=https://zbot-games-galaxian-stg.pages.dev" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
            echo "project_name=zbot-games-galaxian-dev" >> $GITHUB_OUTPUT
            echo "preview_url=https://zbot-games-galaxian-dev.pages.dev" >> $GITHUB_OUTPUT
          fi

  lint-and-test:
    name: 🔍 Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎨 Check code format
        run: npm run format -- --check
        continue-on-error: true

      - name: 📋 Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: ✅ Run tests
        run: npm run test -- --coverage --ci
        continue-on-error: true

      - name: 📊 Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  build:
    name: 🏗️ Build & Deploy
    runs-on: ubuntu-latest
    needs: [determine-environment, lint-and-test]
    if: github.event_name == 'push'
    environment:
      name: ${{ needs.determine-environment.outputs.environment }}
      url: ${{ needs.determine-environment.outputs.preview_url }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build

      - name: 📁 Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build output directory 'dist' not found!"
            exit 1
          fi
          echo "✅ Build output verified"
          ls -lh dist/

      - name: 🌐 Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ needs.determine-environment.outputs.project_name }}
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: 📢 Deployment Notification
        run: |
          echo "✅ Deployment Successful!"
          echo ""
          echo "🌍 Environment: ${{ needs.determine-environment.outputs.environment }}"
          echo "📁 Project: ${{ needs.determine-environment.outputs.project_name }}"
          echo "🔗 URL: ${{ needs.determine-environment.outputs.preview_url }}"

  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚨 Audit dependencies
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: 🛡️ Check for vulnerable packages
        run: npm audit --production
        continue-on-error: true
