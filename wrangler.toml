name = "zbot-games-galaxian"
type = "javascript"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Account ID from sp1050107@gmail.com Cloudflare account
account_id = "21a0246272ef2a34fb908aabdbf60516"
project_name = "zbot-games-galaxian"

# Environment definitions for dev/stg/prod
[env.dev]
name = "games-galaxian-dev"
routes = [{ pattern = "games-galaxian-dev.sp1050107.workers.dev" }]
vars = { ENVIRONMENT = "development", API_BASE = "https://games-galaxian-dev.sp1050107.workers.dev" }

[env.stg]
name = "games-galaxian-stg"
routes = [{ pattern = "games-galaxian-stg.sp1050107.workers.dev" }]
vars = { ENVIRONMENT = "staging", API_BASE = "https://games-galaxian-stg.sp1050107.workers.dev" }

[env.prod]
name = "games-galaxian-prod"
routes = [{ pattern = "games-galaxian-prod.sp1050107.workers.dev" }]
vars = { ENVIRONMENT = "production", API_BASE = "https://games-galaxian-prod.sp1050107.workers.dev" }

[build]
command = "npm run build"
cwd = "."

[site]
bucket = "./dist"

# Development Environment
[env.development]
name = "zbot-games-galaxian-dev"
routes = [
  { pattern = "localhost:*", zone_id = "" }
]
vars = { ENVIRONMENT = "development", API_URL = "http://localhost:8788" }

# Preview/Staging Environment
[env.preview]
name = "zbot-games-galaxian-preview"
routes = [
  { pattern = "*.zbot-games-galaxian-preview.pages.dev", zone_id = "" }
]
vars = { ENVIRONMENT = "preview", API_URL = "https://preview.zbot-games-galaxian.pages.dev" }

# Production Environment
[env.production]
name = "zbot-games-galaxian"
routes = [
  { pattern = "zbot-games-galaxian.pages.dev", zone_id = "" },
  { pattern = "www.zbot-games-galaxian.pages.dev", zone_id = "" }
]
vars = { ENVIRONMENT = "production", API_URL = "https://zbot-games-galaxian.pages.dev" }

# Cache Configuration
[[routes]]
pattern = "*.html"
cache_control = "no-cache, no-store, must-revalidate"

[[routes]]
pattern = "*.js"
cache_control = "public, max-age=31536000, immutable"

[[routes]]
pattern = "*.css"
cache_control = "public, max-age=31536000, immutable"

[[routes]]
pattern = "*.png"
cache_control = "public, max-age=31536000, immutable"

[[routes]]
pattern = "*.jpg"
cache_control = "public, max-age=31536000, immutable"

[[routes]]
pattern = "*.woff2"
cache_control = "public, max-age=31536000, immutable"

# Analytics
[analytics]
enabled = true

# Observability
[observability]
enabled = true
