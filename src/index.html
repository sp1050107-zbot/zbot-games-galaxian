<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Galaxian - Classic Arcade Game Recreation" />
    <meta name="theme-color" content="#000000" />
    <title>🎮 Galaxian</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: #000000;
        color: #ffffff;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
      }

      #app {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100vh;
        background: linear-gradient(135deg, #000000 0%, #1a0033 100%);
        padding: 20px;
      }

      .game-container {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      #gameCanvas {
        display: block;
        border: 3px solid #00ff00;
        box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        background-color: #000000;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      .controls {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        text-align: center;
        color: #00ff00;
      }

      .controls-info {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
        margin-top: 15px;
      }

      .control-item {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .control-key {
        font-weight: bold;
        color: #ffff00;
      }

      .score-display {
        font-size: 24px;
        font-weight: bold;
        color: #00ff00;
        text-shadow: 0 0 10px rgba(0, 255, 0, 0.7);
      }

      .high-score {
        font-size: 16px;
        color: #ff00ff;
        text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
      }

      .game-info {
        display: flex;
        justify-content: space-between;
        gap: 30px;
        margin-top: 10px;
        font-size: 16px;
      }

      .game-status {
        text-align: center;
        font-size: 18px;
        font-weight: bold;
        margin-top: 10px;
        min-height: 24px;
      }

      .status-playing {
        color: #00ff00;
      }

      .status-paused {
        color: #ffff00;
      }

      .status-gameover {
        color: #ff0000;
      }

      .status-levelcomplete {
        color: #00ffff;
      }

      .button-group {
        display: flex;
        gap: 10px;
        margin-top: 15px;
      }

      button {
        padding: 10px 20px;
        font-size: 14px;
        background-color: #1a1a1a;
        color: #00ff00;
        border: 2px solid #00ff00;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: bold;
      }

      button:hover {
        background-color: #00ff00;
        color: #000000;
        box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
      }

      button:active {
        transform: scale(0.95);
      }

      .footer {
        margin-top: 20px;
        font-size: 12px;
        color: #666666;
        text-align: center;
      }

      .footer a {
        color: #00ff00;
        text-decoration: none;
      }

      .footer a:hover {
        text-decoration: underline;
      }

      @media (max-width: 900px) {
        #gameCanvas {
          max-width: 100%;
          height: auto;
        }

        .controls-info {
          grid-template-columns: 1fr;
        }

        button {
          padding: 8px 16px;
          font-size: 12px;
        }
      }

      /* Retro text effect */
      @keyframes glow {
        0%,
        100% {
          text-shadow: 0 0 10px rgba(0, 255, 0, 0.7),
            0 0 20px rgba(0, 255, 0, 0.5);
        }
        50% {
          text-shadow: 0 0 20px rgba(0, 255, 0, 1),
            0 0 30px rgba(0, 255, 0, 0.8);
        }
      }

      .glow-text {
        animation: glow 2s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="game-container">
        <h1 class="glow-text">🎮 GALAXIAN</h1>

        <canvas
          id="gameCanvas"
          width="800"
          height="600"
          role="main"
          aria-label="Galaxian game canvas"
        ></canvas>

        <div class="game-info">
          <div class="score-display">Score: <span id="score">0</span></div>
          <div class="high-score">High: <span id="highScore">0</span></div>
          <div class="score-display">Lives: <span id="lives">3</span></div>
        </div>

        <div class="game-status" id="gameStatus"></div>

        <div class="controls">
          <div>
            <strong>🎮 Controls:</strong>
          </div>
          <div class="controls-info">
            <div class="control-item">
              <span class="control-key">← Arrow Left →</span>
              <span>Move</span>
            </div>
            <div class="control-item">
              <span class="control-key">Spacebar</span>
              <span>Fire</span>
            </div>
            <div class="control-item">
              <span class="control-key">P</span>
              <span>Pause</span>
            </div>
            <div class="control-item">
              <span class="control-key">R</span>
              <span>Restart</span>
            </div>
          </div>
        </div>

        <div class="button-group">
          <button id="pauseBtn">Pause</button>
          <button id="restartBtn">Restart</button>
          <button id="settingsBtn">Settings</button>
        </div>
      </div>

      <div class="footer">
        <p>
          Galaxian Recreation | Built with HTML5 Canvas & TypeScript |
          <a href="https://github.com/sp1050107-zbot/zbot-games-galaxian"
            >Source Code</a
          >
        </p>
        <p>© 2025 sp1050107 | Inspired by the classic Arcade game</p>
      </div>
    </div>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
